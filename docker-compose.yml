services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: storeforge
      POSTGRES_USER: storeforge
      POSTGRES_PASSWORD: storeforge
    ports:
      - "5432:5432"
    volumes:
      - storeforge-postgres:/var/lib/postgresql/data

  storeforge:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      STOREFORGE_ENV: development
      STOREFORGE_PORT: 8787
      DATABASE_URL: postgresql://storeforge:storeforge@postgres:5432/storeforge
      MODEL_PROVIDER: mock
    ports:
      - "8787:8787"
    depends_on:
      - postgres

volumes:
  storeforge-postgres:
